<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Beam</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f3f6;
      --side: #e9ebf0;
      --card: #ffffff;
      --text: #1c1f24;
      --muted: #6b7280;
      --faint: #9aa3af;
      --accent: #4f7cff;
      --ok: #23a55a;
      --err: #e5484d;
      --border: #dfe2e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --side: #1b1e24;
        --card: #1f232b;
        --text: #eceff3;
        --muted: #9aa3af;
        --faint: #6b7280;
        --border: #2c313a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-size: 13px;
    }
    .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

    /* ------------------------------------------------------------ sidebar */
    .sidebar {
      background: var(--side);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto;
      padding-top: 34px; /* clears the inset traffic lights */
      -webkit-app-region: drag;
    }
    .sidebar button, .sidebar .item { -webkit-app-region: no-drag; }
    .brand {
      font-size: 15px; font-weight: 700; padding: 6px 16px 12px;
      display: flex; align-items: center; gap: 7px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .dot.off { background: var(--faint); }
    .side-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 4px; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--faint);
    }
    .side-head button {
      background: none; border: 0; color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 2px 4px; border-radius: 4px;
    }
    .side-head button:hover { color: var(--accent); }
    .item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 16px; cursor: pointer; border-left: 2px solid transparent;
    }
    .item:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .item.sel {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-left-color: var(--accent);
    }
    .item.disabled { opacity: 0.5; cursor: default; }
    .item.disabled:hover { background: none; }
    .item .ico { font-size: 14px; line-height: 1.4; }
    .item .txt { min-width: 0; flex: 1; }
    .item .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .sub { color: var(--muted); font-size: 11px; margin-top: 1px; }
    .side-empty { color: var(--faint); font-size: 11.5px; padding: 4px 16px 6px; }
    .side-foot {
      margin-top: auto; padding: 10px 16px; font-size: 11px; color: var(--faint);
      border-top: 1px solid var(--border);
    }

    /* --------------------------------------------------------------- main */
    /* min-height:0 on both, or a long listing expands instead of scrolling
       and pushes the status bar off the bottom of the window. */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .mainbar {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      /* Eleven controls don't fit a narrow window; scrolling beats clipping
         the last button off the edge. */
      overflow-x: auto; scrollbar-width: none;
    }
    .mainbar::-webkit-scrollbar { display: none; }
    /* The path is the only thing here that can give up space. */
    .mainbar .tool, .mainbar .search { flex: none; }
    .mainbar * { -webkit-app-region: no-drag; }
    .crumbs {
      flex: 1 1 0; min-width: 0; font-family: ui-monospace, monospace; font-size: 12px;
      color: var(--muted); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }
    .tool {
      background: transparent; color: var(--text); font-size: 12px;
      border: 1px solid var(--border); border-radius: 7px; padding: 5px 9px;
      cursor: pointer; white-space: nowrap;
    }
    .tool:disabled { opacity: 0.4; cursor: default; }
    .tool:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
    .tool.danger:not(:disabled):hover { border-color: var(--err); color: var(--err); }
    .tool.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tool.primary:disabled { background: var(--border); border-color: var(--border); color: var(--muted); }

    .search {
      width: 96px; min-width: 72px; font-size: 12px; font-family: inherit;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px; padding: 5px 9px;
    }
    .search:focus { outline: none; border-color: var(--accent); }
    select.tool { padding-right: 4px; }

    .retry {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--err) 10%, transparent);
      font-size: 12px;
    }
    .retry .txt {
      flex: 1; min-width: 0; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .thumb {
      width: 28px; height: 28px; object-fit: cover; border-radius: 5px;
      background: var(--border); flex: none;
    }

    /* ---------------------------------------------------------- categories */
    .catbar {
      display: flex; gap: 6px; padding: 8px 14px; overflow-x: auto;
      border-bottom: 1px solid var(--border); flex: none;
    }
    .catbar:empty { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      background: transparent; color: var(--muted); font-size: 12px;
      font-family: inherit; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.sel {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-color: var(--accent); color: var(--text);
    }
    .chip .count {
      font-size: 11px; font-variant-numeric: tabular-nums; color: var(--faint);
    }
    .chip.sel .count { color: var(--accent); }

    .ficon { font-size: 16px; width: 28px; text-align: center; flex: none; }
    .cat-note { color: var(--faint); font-size: 11.5px; padding: 4px 2px; }
    .where {
      color: var(--faint); font-size: 11px; max-width: 240px; flex: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: ui-monospace, monospace;
    }
    .more-note {
      color: var(--faint); font-size: 11.5px; text-align: center; padding: 14px;
    }

    .content { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0; }
    .content.over { outline: 2px solid var(--accent); outline-offset: -6px; }

    .entry {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 16px; border-bottom: 1px solid var(--border);
    }
    .entry:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
    .entry.cut { opacity: 0.45; }
    .entry input { accent-color: var(--accent); }
    .entry .nm { flex: 1; min-width: 0; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry .nm.file { cursor: grab; }
    /* Pulled from the phone and sitting in a temp file: this one will drop. */
    .entry .nm.ready::after {
      content: '⤓'; color: var(--ok); font-size: 11px; margin-left: 7px;
    }
    .entry .nm.dir { cursor: pointer; }
    .entry .sz {
      color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums;
      min-width: 66px; text-align: right;
    }
    .entry .dt {
      color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums;
      min-width: 104px; text-align: right; white-space: nowrap; flex: none;
    }
    .rename-input {
      flex: 1; font-size: 13px; font-family: inherit;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--accent); border-radius: 6px; padding: 3px 6px;
    }

    .blank {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 10px; color: var(--muted); text-align: center; padding: 30px;
    }
    .blank .big { font-size: 34px; }
    .blank .hint { font-size: 12.5px; max-width: 420px; line-height: 1.5; }
    .dropbox {
      border: 1.5px dashed var(--border); border-radius: 12px;
      padding: 26px 34px; color: var(--muted); font-size: 13px;
    }
    .dropbox.over { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .err { color: var(--err); }

    .statusbar {
      display: flex; align-items: center; gap: 12px;
      border-top: 1px solid var(--border); padding: 7px 14px;
      font-size: 11.5px; color: var(--muted); min-height: 34px;
    }
    .bar { flex: 1; max-width: 220px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s; }

    /* ------------------------------------------------------------- dialog */
    dialog {
      border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px;
      background: var(--card); color: var(--text); width: 340px;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
    dialog h3 { margin: 0 0 6px; font-size: 14px; }
    .dlg-hint { margin: 0 0 12px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    dialog input {
      width: 100%; font-size: 13px; font-family: ui-monospace, monospace;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px;
    }
    .dlg-err { color: var(--err); font-size: 11.5px; min-height: 16px; padding: 4px 1px 0; }
    .dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

    /* -------------------------------------------------------------- recent */
    .recent { padding: 4px 0; }
    .recent .row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 16px; border-bottom: 1px solid var(--border);
    }
    .recent .row .dir { font-size: 13px; width: 16px; text-align: center; }
    .recent .row .dir.in { color: var(--ok); }
    .recent .row .dir.out { color: var(--accent); }
    .recent .row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent .row .nm.open { cursor: pointer; }
    .recent .row .nm.open:hover { color: var(--accent); }
    .recent .row .meta { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="dot" id="live-dot"></span>Beam</div>

      <div class="side-head">This Mac</div>
      <div id="side-mac"></div>

      <div class="side-head">
        <span>USB</span><button id="refresh-usb" title="Rescan USB">⟳</button>
      </div>
      <div id="side-usb"><div class="side-empty">Looking…</div></div>

      <div class="side-head">
        <span>Wi-Fi</span>
        <span>
          <button id="add-wifi" title="Connect by IP address">+</button>
          <button id="refresh-wifi" title="Rescan network">⟳</button>
        </span>
      </div>
      <div id="side-wifi"><div class="side-empty">Looking…</div></div>

      <div class="side-foot" id="side-foot">—</div>
    </aside>

    <main class="main">
      <div class="mainbar">
        <button class="tool" id="nav-up" title="Up one folder">↑</button>
        <div class="crumbs" id="crumbs"></div>
        <input class="search" id="search" type="search" placeholder="Search" />
        <select class="tool" id="sort-key" title="Sort by">
          <option value="name">Name</option>
          <option value="size">Size</option>
          <option value="date">Date</option>
        </select>
        <button class="tool" id="sort-dir" title="Sort direction">↑</button>
        <button class="tool" id="op-newfolder">New folder</button>
        <button class="tool" id="op-rename">Rename</button>
        <button class="tool" id="op-cut">Cut</button>
        <button class="tool" id="op-paste">Paste</button>
        <button class="tool danger" id="op-delete">Delete</button>
        <button class="tool primary" id="op-copy">Copy to Mac</button>
        <button class="tool" id="op-copy-where" title="Choose where copies go">⋯</button>
      </div>

      <div class="catbar" id="catbar"></div>

      <div class="content" id="content"></div>

      <div class="statusbar">
        <span id="status">Ready</span>
        <div class="bar" id="bar"><div></div></div>
      </div>
    </main>
  </div>

  <dialog id="ip-dialog">
    <form method="dialog">
      <h3>Connect by IP</h3>
      <p class="dlg-hint">
        Use this when the scan can't see a phone — guest Wi-Fi, or a network
        that blocks device-to-device traffic. The address is on the phone's
        “Receive files” card.
      </p>
      <input id="ip-input" placeholder="192.168.0.9" autocomplete="off" />
      <div class="dlg-err" id="ip-error"></div>
      <div class="dlg-btns">
        <button class="tool" value="cancel">Cancel</button>
        <button class="tool primary" id="ip-go" value="connect">Connect</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
